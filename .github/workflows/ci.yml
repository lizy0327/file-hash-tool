name: 构建与测试 / Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux 构建与测试 / Linux build and test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 / Check out source
        uses: actions/checkout@v4
      - name: 安装依赖 / Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libgtk-3-dev libssl-dev
      - name: 配置 / Configure
        run: cmake -S . -B build -G Ninja -DFILEHASHTOOL_BUILD_GUI=ON -DFILEHASHTOOL_BUILD_SMOKE_TEST=ON -DFILEHASHTOOL_BUILD_BENCHMARK=ON
      - name: 构建 / Build
        run: cmake --build build --parallel
      - name: 测试 / Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows x86 构建与测试 / Windows x86 build and test
    # 中文：固定到包含 VS2022 的镜像，避免 latest 镜像变更导致生成器不匹配 / English: Pin the image that includes VS2022 to avoid generator drift on latest images
    runs-on: windows-2022
    steps:
      - name: 检出代码 / Check out source
        uses: actions/checkout@v4
      - name: 配置 / Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DFILEHASHTOOL_BUILD_BENCHMARK=ON
      - name: 构建 / Build
        run: cmake --build build --config Release --parallel
      - name: 测试 / Test
        run: ctest --test-dir build -C Release --output-on-failure
